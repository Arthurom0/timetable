# Builds the Mac and Windows apps and attaches them to a GitHub Release.
# Push a tag such as v1.0.0 to publish a release; "Run workflow" on the Actions tab
# only builds the files (download them from the run page) without releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Timetable-Mac.dmg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || VERSION=1.0
          VERSION="$VERSION" bash Timetable-Mac/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: Timetable-Mac/Timetable-Mac.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Timetable.exe
        shell: powershell
        run: |
          Remove-Item Timetable\Timetable.exe
          & .\Timetable\source\build.ps1
          if (-not (Test-Path Timetable\Timetable.exe)) { throw "Build failed" }
      - name: Make Timetable-Windows.zip
        shell: powershell
        run: |
          New-Item -ItemType Directory out\Timetable | Out-Null
          Copy-Item Timetable\Timetable.exe out\Timetable\
          Copy-Item Timetable\wallpaper out\Timetable\wallpaper -Recurse
          Copy-Item Timetable\source out\Timetable\source -Recurse
          Copy-Item "Timetable\Build Timetable.bat" out\Timetable\
          Compress-Archive out\Timetable Timetable-Windows.zip
          Copy-Item Timetable\Timetable.exe Timetable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Timetable-Windows.zip
            Timetable.exe

  release:
    if: github.ref_type == 'tag'
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Timetable-Mac.dmg
            Timetable-Windows.zip
            Timetable.exe
